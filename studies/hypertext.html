<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A disposable Hypertext study derived from the canonical performative essay.">
  <title>Hypertext study — The frame problem in agent threads</title>
  <link rel="stylesheet" href="../src/studies/hypertext.css">
</head>
<body>
  <header class="study-head">
    <span class="station">06</span>
    <div>
      <strong>Hypertext study</strong>
      <span>Sequence is no longer the only access structure.</span>
    </div>
    <span class="study-label">Disposable · not integrated</span>
  </header>

  <div class="location-bar">
    <button class="back" id="backButton" type="button" aria-label="Return to the previous place">← Back</button>
    <nav class="breadcrumb" id="breadcrumb" aria-label="Current location"></nav>
  </div>

  <div class="information-space">
    <aside class="section-region" aria-label="Essay sections">
      <label for="mobileSections">Places in this essay</label>
      <select id="mobileSections" aria-label="Choose a section"></select>
      <nav id="sectionNavigation"></nav>
      <p class="nav-note">Choose a place directly. The essay stays the same; only your location changes.</p>
    </aside>

    <main class="place" id="place" tabindex="-1" aria-live="polite">
      <p class="loading">Deriving places from the canonical essay…</p>
    </main>
  </div>

  <iframe class="canonical-source" id="canonicalSource" title="Canonical essay content source" aria-hidden="true"></iframe>
  <script type="module" src="../src/studies/hypertext.ts"></script>
</body>
</html>
